services:
  dev:
    build:
      context: .
    image: spritey-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    environment:
      CGO_ENABLED: "0"
    command: go test ./...

volumes:
  go-build-cache:
  go-mod-cache:
